<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emax Group — Daily Financial Report</title>
<style>
  :root{
    --navy:#1C2333;
    --navy-2:#2A3350;
    --cream:#F6F4EE;
    --card:#FFFFFF;
    --blue-head:#C9D9F0;
    --amber:#0A1628;
    --amber-dark:#162B52;
    --yellow:#FFD500;
    --ink:#20242E;
    --muted:#6B7280;
    --border:#E4E1D6;
    --danger:#D64545;
    --good:#2E8B57;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--cream); color:var(--ink);
  }
  header{
    background:var(--navy); color:#fff; padding:18px 16px 14px;
    position:sticky; top:0; z-index:20;
  }
  header h1{
    margin:0; font-size:18px; letter-spacing:0.2px; font-weight:700;
  }
  header .sub{color:#AEB6CC; font-size:12px; margin-top:2px;}
  .tabs{
    display:flex; gap:8px; padding:12px 12px 0; overflow-x:auto; background:var(--navy);
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto; padding:9px 14px; border-radius:10px 10px 0 0; border:none;
    background:var(--navy-2); color:#C7CEDE; font-weight:600; font-size:13px; cursor:pointer;
    white-space:nowrap;
  }
  .tab-btn.active{background:var(--cream); color:var(--navy);}
  main{padding:14px; max-width:720px; margin:0 auto 90px;}
  .topbar{
    display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;
  }
  .topbar label{font-size:12px; color:var(--muted); font-weight:600; display:block; margin-bottom:3px;}
  .topbar input[type=date], .topbar input[type=time]{
    padding:8px 10px; border-radius:8px; border:1px solid var(--border); font-size:14px; background:#fff;
  }
  .card{
    background:var(--card); border-radius:12px; margin-bottom:14px; overflow:hidden;
    border:1px solid var(--border); box-shadow:0 1px 2px rgba(0,0,0,0.03);
  }
  .card-head{
    background:var(--blue-head); padding:10px 14px; font-weight:700; font-size:13.5px;
    display:flex; justify-content:space-between; align-items:center; color:var(--navy);
  }
  .row-list{padding:6px 10px;}
  .row-item{
    display:flex; gap:6px; align-items:center; padding:6px 2px; border-bottom:1px solid #F0EEE6;
  }
  .row-item:last-child{border-bottom:none;}
  .row-item input[type=text]{
    flex:1 1 auto; min-width:0; border:none; background:transparent; font-size:13.5px; padding:6px 4px;
    border-bottom:1px dashed transparent;
  }
  .row-item input[type=text]:focus{outline:none; border-bottom:1px dashed var(--amber);}
  .row-item .amt-wrap{display:flex; align-items:center; gap:2px; flex:0 0 auto;}
  .row-item .amt-wrap span{font-size:12px; color:var(--muted);}
  .row-item input[type=number]{
    width:100px; text-align:right; border:none; background:#FAF9F5; border-radius:6px; padding:6px 8px;
    font-size:13.5px; font-variant-numeric:tabular-nums;
  }
  .row-item input[type=number]:focus{outline:1.5px solid var(--amber);}
  .row-item .del{
    background:none; border:none; color:var(--danger); font-size:16px; cursor:pointer; padding:2px 6px;
    flex:0 0 auto;
  }
  .add-row-btn{
    margin:8px 10px 10px; padding:7px 12px; border-radius:8px; border:1px dashed #B9B6A8;
    background:transparent; color:var(--navy-2); font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .total-row{
    background:var(--amber); color:#fff; display:flex; justify-content:space-between;
    padding:9px 14px; font-weight:700; font-size:13.5px;
  }
  .total-row span.tval{font-variant-numeric:tabular-nums;}
  .fixed-fields{padding:8px 12px 12px;}
  .field{margin-bottom:8px;}
  .field label{display:block; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:3px;}
  .field input{
    width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); font-size:14px;
    font-variant-numeric:tabular-nums;
  }
  .field-row{display:flex; gap:8px;}
  .field-row .field{flex:1;}
  .stock-row{
    display:grid; grid-template-columns:1fr 100px 100px 24px; gap:8px; align-items:center; padding:7px 4px;
    border-bottom:1px solid #F0EEE6;
  }
  .stock-row:last-child{border-bottom:none;}
  .stock-row input[type=text]{border:none; background:transparent; font-size:13px; padding:5px 2px;}
  .stock-row input[type=number]{
    border:none; background:#FAF9F5; border-radius:6px; padding:6px 8px; font-size:12.5px; text-align:right;
  }
  .stock-head{
    display:grid; grid-template-columns:1fr 100px 100px 24px; gap:8px; padding:4px 12px 6px; font-size:9.5px;
    color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.2px; line-height:1.2;
  }
  .save-bar{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:2px solid var(--border);
    padding:10px 14px; display:flex; gap:8px; z-index:9999;
    box-shadow:0 -2px 12px rgba(0,0,0,.08);
  }
  .btn{
    flex:1; padding:12px; border-radius:10px; border:none; font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-primary{background:var(--yellow); color:var(--navy);}
  .btn-secondary{background:var(--navy); color:#fff;}
  .history{
    padding:10px 12px 12px;
  }
  .history summary{cursor:pointer; font-weight:600; font-size:13px; color:var(--navy-2); padding:6px 0;}
  summary{ list-style:none; }
  summary::-webkit-details-marker{ display:none; }
  .hist-item{
    display:flex; justify-content:space-between; align-items:center; padding:8px 4px; border-bottom:1px solid #F0EEE6;
    font-size:13px;
  }
  .hist-item button{
    border:1px solid var(--border); background:#fff; border-radius:7px; padding:5px 10px; font-size:12px; cursor:pointer;
  }
  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff;
    padding:9px 16px; border-radius:20px; font-size:13px; z-index:99; opacity:0; transition:opacity .25s;
    pointer-events:none;
  }
  .toast.show{opacity:1;}
  .month-picker{margin-bottom:12px;}
  .month-picker label{font-size:12px; color:var(--muted); font-weight:600; display:block; margin-bottom:3px;}
  .month-picker input{padding:8px 10px; border-radius:8px; border:1px solid var(--border); font-size:14px;}
  .empty-hint{font-size:12px; color:var(--muted); padding:8px 12px;}
  .copy-btn{
    background:none; border:1px solid var(--border); color:var(--navy-2); font-size:11.5px; font-weight:600;
    padding:5px 9px; border-radius:7px; cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Emax Group — Daily Financial Report</h1>
  <div class="sub">Key in daily figures for each company · saved automatically</div>
  <div class="tabs" id="tabs"></div>
</header>

<main id="main"></main>

<div class="save-bar">
  <button class="btn btn-secondary" id="photoBtn">Save as Photo</button>
  <button class="btn btn-primary" id="saveBtn">Save Report</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
    // ── localStorage shim for window.storage API ──────────────────────
    window.storage = {
      get: async (key) => {
        try {
          const val = localStorage.getItem('emax_report:' + key);
          return val !== null ? { key, value: val } : null;
        } catch(e) { return null; }
      },
      set: async (key, value) => {
        try {
          localStorage.setItem('emax_report:' + key, value);
          return { key, value };
        } catch(e) { return null; }
      },
      delete: async (key) => {
        try {
          localStorage.removeItem('emax_report:' + key);
          return { key, deleted: true };
        } catch(e) { return null; }
      },
      list: async (prefix) => {
        try {
          const fullPrefix = 'emax_report:' + prefix;
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith(fullPrefix)) {
              keys.push(k.replace('emax_report:', ''));
            }
          }
          return { keys, prefix };
        } catch(e) { return { keys: [], prefix }; }
      }
    };
    // ──────────────────────────────────────────────────────────────────

const STORAGE_SHARED = true; // shared so the whole team sees the same reports

const COMPANIES = {
  emax: {
    name: 'EMAX NETWORK SDN BHD',
    shortLabel: 'Emax',
    hasTime: true,
    sections: ['bank','stock','aeon','jcl','rto','supplier','customer']
  },
  spoonfork: {
    name: 'SPOON & FORK SDN BHD',
    shortLabel: 'Spoon & Fork',
    hasTime: true,
    sections: ['bank']
  },
  espacex: {
    name: 'ESPACE X SDN BHD',
    shortLabel: 'Espace X (Bank)',
    hasTime: true,
    sections: ['bank']
  },
  dojo: {
    name: 'DOJO',
    shortLabel: 'Dojo (Sales)',
    hasTime: false,
    sections: ['salesReport','summary'],
    photoSections: ['salesReport']
  },
  espaceSales: {
    name: 'ESPACE X — DAILY SALES ANALYSIS',
    shortLabel: 'Espace X (Sales)',
    hasTime: false,
    sections: ['salesReport','playground','activateGame','other']
  },
  miniImpianBank: {
    name: 'MINI IMPIAN',
    shortLabel: 'Mini Impian (Bank)',
    hasTime: true,
    sections: ['bank']
  },
  miniImpianSales: {
    name: 'MINI IMPIAN — DAILY SALES ANALYSIS',
    shortLabel: 'Mini Impian (Sales)',
    hasTime: false,
    sections: ['salesReport','playground','other']
  }
};

const QTY_SECTIONS = new Set(['playground','activateGame','other']);

const SECTION_TITLES = {
  bank:'Bank Balance', stock:'Stock Balance', aeon:'AEON (Unclaimed)',
  jcl:'JCL (Unclaimed)', rto:'Rent-to-Own (RTO)', supplier:'Supplier', customer:'Customer',
  salesReport:'Daily Sales Report', summary:'Summary', playground:'Children Playground',
  activateGame:'Activate Game', other:'Other', rtoCare:'RTO Customers'
};

function defaultRows(company, section){
  if(section==='bank'){
    if(company==='emax') return [
      {label:'Public Bank',amount:''},{label:'Agro',amount:''},
      {label:'RHB',amount:''},{label:'RHB (AEON 1st Payment)',amount:''}
    ];
    if(company==='spoonfork') return [
      {label:'Public Bank',amount:''},{label:'Maybank',amount:''},
      {label:'Alliance Bank',amount:''},{label:'Cash In Hand (Pending Transfer to PBB)',amount:''}
    ];
    if(company==='espacex') return [
      {label:'Maybank',amount:''},{label:'Cash In Hand (Pending Transfer to PBB)',amount:''}
    ];
    if(company==='miniImpianBank') return [
      {label:'Public Bank',amount:''},
      {label:'Cash in Hand -SDK (PENDING TRANSFER TO PBB)',amount:''},
      {label:'Cash in Hand -TAWAU (PENDING TRANSFER TO PBB)',amount:''}
    ];
  }
  if(section==='aeon') return [{label:'',amount:''}];
  if(section==='jcl') return [{label:'',amount:''}];
  if(section==='supplier') return [{label:'Xianfeng',amount:''},{label:'E-Century',amount:''}];
  if(section==='customer') return [{label:'',amount:''}];
  return [];
}

function defaultQtyRowsFor(section){
  if(section==='playground') return [
    {label:'Socks',qty:'',amount:''},{label:'Daily Pass',qty:'',amount:''},
    {label:'10 Entries Pass',qty:'',amount:''},{label:'6 Entries Pass',qty:'',amount:''},
    {label:'Redemption',qty:'',amount:''}
  ];
  if(section==='activateGame') return [
    {label:'Extra Hour',qty:'',amount:''},{label:'(Weekend/SH) One Time Pass',qty:'',amount:''},
    {label:'(Weekday) One Time Pass',qty:'',amount:''},{label:'10 Entries Pass',qty:'',amount:''},
    {label:'5 Entries Pass',qty:'',amount:''},{label:'Redemption',qty:'',amount:''}
  ];
  if(section==='other') return [{label:'Google Review (Free Socks)',qty:'',amount:''}];
  return [{label:'',qty:'',amount:''}];
}
function defaultQtyRows(section,company){
  if(company==='miniImpianSales') return {
    sandakan: defaultQtyRowsFor(section).map(r=>({...r})),
    tawau: defaultQtyRowsFor(section).map(r=>({...r}))
  };
  return defaultQtyRowsFor(section);
}

function defaultSalesReport(company){
  if(company==='miniImpianSales') return { sandakan:{cash:'',card:'',qr:''}, tawau:{cash:'',card:'',qr:''} };
  return { cash:'', card:'', qr:'' };
}

function defaultSummaryData(){
  return {
    cashSalesTotal:'', cashSalesDiscount:'',
    surcharge:'',
    grabFoodSst:'',
    foodPandaSst:'',
    sst:'',
    aisolove:''
  };
}

function defaultStockRows(){
  return ['CKS','KM','TW2','HQ','ITCC','KB','LD','TW1','SUSPENSE','T1','TENOM']
    .map(b=>({branch:b, category:'', total:''}));
}

function defaultRto(){
  return {
    contractValue:'', deviceDTP:'', expectedProfit:'', collectedPayment:'',
    pendingMonths:[{month:'',count:'',amount:''}],
    nextMonthAmount:'', nextMonthLabel:''
  };
}

function migratePendingMonths(d){
  if(!d.pendingMonths){
    d.pendingMonths=[{month:d.pendingMonth||'',count:d.pendingCount||'',amount:d.pendingAmount||''}];
    delete d.pendingMonth; delete d.pendingCount; delete d.pendingAmount;
  }
  return d;
}

const RTO_CARE_FIELDS = [
  {key:'agent', label:'Agent', type:'text'},
  {key:'memberId', label:'Emax Member ID', type:'text'},
  {key:'customerName', label:'Customer Name', type:'text'},
  {key:'branch', label:'Branch', type:'text'},
  {key:'contactNumber', label:'Contact Number', type:'text'},
  {key:'salesInvoiceDate', label:'Sales Invoice Date', type:'date'},
  {key:'tenure', label:'Tenure (months)', type:'number'},
  {key:'fp', label:'FP (RM)', type:'number'},
  {key:'branchProfit', label:'Branch Profit (RM)', type:'number'},
  {key:'ag', label:'AG (RM)', type:'number'},
  {key:'sf', label:'SF (RM)', type:'number'},
  {key:'cost', label:'Cost (RM)', type:'number'},
  {key:'monthlyInstallment', label:'Monthly Installment (RM)', type:'number'},
  {key:'totalContractValue', label:'Total Contract Value (RM)', type:'number'},
  {key:'paymentReceived', label:'Payment Received (RM)', type:'number'},
  {key:'autoDebitStartDate', label:'Auto Debit Start Date', type:'date'},
];

function defaultRtoCareRecord(){
  const rec = { schedule:[] };
  RTO_CARE_FIELDS.forEach(f=>{ rec[f.key] = ''; });
  return rec;
}

function ordinal(n){
  const s=['th','st','nd','rd'], v=n%100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

function blankReport(company){
  const r = { date:new Date().toISOString().slice(0,10), time:'', sections:{} };
  const cfg = COMPANIES[company];
  cfg.sections.forEach(sec=>{
    if(sec==='stock') r.sections.stock = defaultStockRows();
    else if(sec==='rto') r.sections.rto = defaultRto();
    else if(sec==='salesReport') r.sections.salesReport = defaultSalesReport(company);
    else if(sec==='summary') r.sections.summary = defaultSummaryData();
    else if(sec==='rtoCare') r.sections.rtoCare = [defaultRtoCareRecord()];
    else if(QTY_SECTIONS.has(sec)) r.sections[sec] = defaultQtyRows(sec,company);
    else r.sections[sec] = defaultRows(company, sec);
  });
  return r;
}

function blankFailedLog(){
  return { month:new Date().toISOString().slice(0,7), rows:[{name:'',contact:'',amount:''}] };
}

let currentCompany = 'emax';
let refreshSummaryFn = null;
let currentData = blankReport('emax');
let currentFailed = blankFailedLog();

function num(v){ const n = parseFloat(v); return isNaN(n)?0:n; }
function fmt(n){ return n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function storageKeyReport(company, date){ return `report:${company}:${date}`; }
function storageKeyFailed(month){ return `failed:${month}`; }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---------- Tabs ----------
function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  Object.keys(COMPANIES).forEach(key=>{
    const b = document.createElement('button');
    b.className = 'tab-btn' + (key===currentCompany?' active':'');
    b.textContent = COMPANIES[key].shortLabel;
    b.onclick = ()=>{ switchCompany(key); };
    tabs.appendChild(b);
  });
}

async function switchCompany(key){
  currentCompany = key;
  renderTabs();
  if(COMPANIES[key].isLog){
    const months = await listFailedMonths();
    await loadFailedLog(months.length ? months[0] : new Date().toISOString().slice(0,7));
  } else {
    const dates = await listReportDates(key);
    await loadReport(key, dates.length ? dates[0] : new Date().toISOString().slice(0,10));
  }
}

// ---------- Load / Save ----------
async function loadReport(company, date){
  try{
    const res = await window.storage.get(storageKeyReport(company, date), STORAGE_SHARED);
    if(res && res.value){
      currentData = JSON.parse(res.value);
      if(currentData.sections && currentData.sections.rto) migratePendingMonths(currentData.sections.rto);
      currentData.date = date;
    } else {
      currentData = blankReport(company);
      currentData.date = date;
      if(company==='emax') await autoFillLabelsFromYesterday(date);
    }
  }catch(e){
    currentData = blankReport(company);
    currentData.date = date;
  }
  renderMain();
}

async function autoFillLabelsFromYesterday(date){
  const d = new Date(date); d.setDate(d.getDate()-1);
  const yDate = d.toISOString().slice(0,10);
  let yData = null;
  try{
    const res = await window.storage.get(storageKeyReport('emax',yDate), STORAGE_SHARED);
    yData = res && res.value ? JSON.parse(res.value) : null;
  }catch(e){ return; }
  if(!yData||!yData.sections) return;
  if(yData.sections.bank && Array.isArray(yData.sections.bank))
    currentData.sections.bank = yData.sections.bank.map(r=>({label:r.label,amount:''}));
  if(yData.sections.aeon && Array.isArray(yData.sections.aeon))
    currentData.sections.aeon = yData.sections.aeon.map(r=>({label:r.label,amount:''}));
  if(yData.sections.jcl && Array.isArray(yData.sections.jcl))
    currentData.sections.jcl = yData.sections.jcl.map(r=>({label:r.label,amount:''}));
  if(yData.sections.supplier && Array.isArray(yData.sections.supplier))
    currentData.sections.supplier = yData.sections.supplier.map(r=>({label:r.label,amount:''}));
  if(yData.sections.customer && Array.isArray(yData.sections.customer))
    currentData.sections.customer = yData.sections.customer.map(r=>({label:r.label,amount:''}));
  if(yData.sections.rto){
    const yr = yData.sections.rto;
    if(yr.pendingMonth&&!yr.pendingMonths)
      yr.pendingMonths=[{month:yr.pendingMonth,count:yr.pendingCount||'',amount:''}];
    currentData.sections.rto = {
      contractValue:'', deviceDTP:'', expectedProfit:'', collectedPayment:'',
      pendingMonths:(yr.pendingMonths||[{month:'',count:'',amount:''}]).map(pm=>({month:pm.month,count:'',amount:''})),
      nextMonthLabel:yr.nextMonthLabel||'', nextMonthAmount:''
    };
  }
}

async function saveReport(){
  const company = currentCompany;
  if(COMPANIES[company].isLog){ return saveFailed(); }
  try{
    const res = await window.storage.set(storageKeyReport(company, currentData.date), JSON.stringify(currentData), STORAGE_SHARED);
    if(res) showToast('Saved ✓ ' + currentData.date);
    else showToast('Save failed, try again');
  }catch(e){ showToast('Save failed: '+e.message); }
}

async function loadFailedLog(month){
  try{
    const res = await window.storage.get(storageKeyFailed(month), STORAGE_SHARED);
    currentFailed = res && res.value ? JSON.parse(res.value) : blankFailedLog();
    currentFailed.month = month;
  }catch(e){
    currentFailed = blankFailedLog();
    currentFailed.month = month;
  }
  renderMain();
}

async function saveFailed(){
  try{
    const res = await window.storage.set(storageKeyFailed(currentFailed.month), JSON.stringify(currentFailed), STORAGE_SHARED);
    if(res){ showToast('Saved ✓ '+currentFailed.month); renderMain(); }
    else showToast('Save failed, try again');
  }catch(e){ showToast('Save failed: '+e.message); }
}

async function listReportDates(company){
  try{
    const res = await window.storage.list(`report:${company}:`, STORAGE_SHARED);
    if(!res || !res.keys) return [];
    return res.keys.map(k=>k.split(':')[2]).sort().reverse();
  }catch(e){ return []; }
}

// ---------- Rendering ----------
function renderMain(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  refreshSummaryFn = null;

  if(COMPANIES[currentCompany].isLog){
    renderFailedUI(main);
    return;
  }

  const cfg = COMPANIES[currentCompany];

  // topbar: date/time
  const topbar = document.createElement('div');
  topbar.className = 'topbar';
  topbar.innerHTML = `
    <div><label>Date</label><input type="date" id="dateInput" value="${currentData.date}"></div>
    ${cfg.hasTime ? `<div><label>Time</label><input type="time" id="timeInput" value="${currentData.time||''}"></div>` : ''}
  `;
  main.appendChild(topbar);
  document.getElementById('dateInput').onchange = async (e)=>{
    await loadReport(currentCompany, e.target.value);
  };
  if(cfg.hasTime){
    document.getElementById('timeInput').oninput = (e)=>{ currentData.time = e.target.value; };
  }

  cfg.sections.forEach(sec=>{
    if(sec==='stock') main.appendChild(renderStockCard());
    else if(sec==='rto') main.appendChild(renderRtoCard());
    else if(sec==='salesReport') main.appendChild(renderSalesReportCard());
    else if(sec==='summary') main.appendChild(renderSummaryCard());
    else if(sec==='rtoCare') main.appendChild(renderRtoCareCard());
    else if(QTY_SECTIONS.has(sec)) main.appendChild(renderQtyListCard(sec));
    else main.appendChild(renderListCard(sec));
  });
}

function renderListCard(sec){
  const card = document.createElement('div');
  card.className = 'card';
  const rows = currentData.sections[sec];
  const total = rows.reduce((s,r)=>s+num(r.amount),0);

  card.innerHTML = `<div class="card-head"><span>${SECTION_TITLES[sec]}</span></div>`;
  const list = document.createElement('div');
  list.className = 'row-list';
  rows.forEach((r,i)=>{

function todayISO(){ return new Date().toISOString().slice(0,10); }

function installmentStatus(s){
  if(s.paidDate) return 'Paid';
  if(s.dueDate && s.dueDate < todayISO()) return 'Late';
  if(s.dueDate) return 'Upcoming';
  return '-';
}

function statusColor(status){
  if(status==='Paid') return '#2E8B57';
  if(status==='Late') return '#D64545';
  if(status==='Upcoming') return '#C97E00';
  return '#999';
}

function addMonthsISO(dateStr, months){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  d.setMonth(d.getMonth()+months);
  return d.toISOString().slice(0,10);
}

function renderPaymentMonitor(records){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-head"><span>Payment Monitor — unpaid installments</span></div>`;

  let items = [];
  records.forEach((rec, ri)=>{
    (rec.schedule||[]).forEach((s, si)=>{
      if(!s.paidDate){ items.push({rec, ri, s, si}); }
    });
  });
  items.sort((a,b)=> (a.s.dueDate||'9999').localeCompare(b.s.dueDate||'9999'));

  if(items.length===0){
    const empty = document.createElement('div');
    empty.className = 'empty-hint';
    empty.textContent = 'No unpaid installments — all caught up, or no schedules generated yet.';
    card.appendChild(empty);
    return card;
  }

  const list = document.createElement('div');
  list.className = 'row-list';
  items.forEach(({rec, s, si})=>{
    const status = installmentStatus(s);

function renderRtoCareRecord(rec, index, records){
  const card = document.createElement('details');
  card.className = 'card';
  card.style.marginBottom = '12px';
  card.open = !rec.customerName;

  const outstanding = num(rec.totalContractValue) - num(rec.paymentReceived);
  const breakeven = num(rec.monthlyInstallment) > 0 ? (num(rec.cost) / num(rec.monthlyInstallment)) : 0;

  const summary = document.createElement('summary');
  summary.style.cssText = 'background:#C9D9F0;color:#1C2333;padding:10px 14px;font-weight:700;font-size:13.5px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;list-style:none;flex-wrap:wrap;';
  const nextUnpaid = (rec.schedule||[]).find(s=>!s.paidDate);
  const nextStatus = nextUnpaid ? installmentStatus(nextUnpaid) : null;
  summary.innerHTML = `
    <span class="rc-title">${escapeHtml(rec.customerName)||'New Customer'} ${rec.branch?('· '+escapeHtml(rec.branch)):''}</span>
    <span style="display:flex;gap:10px;align-items:center;">
      ${nextUnpaid ? `<span class="rc-next" style="font-size:11px;font-weight:700;color:${statusColor(nextStatus)};">${escapeHtml(nextUnpaid.label)} due ${nextUnpaid.dueDate||'—'} · ${nextStatus}</span>` : `<span class="rc-next" style="font-size:11px;font-weight:700;color:#2E8B57;">All paid</span>`}
      <span class="rc-outstanding">RM ${fmt(outstanding)}</span>
    </span>
  `;
  card.appendChild(summary);

  const ff = document.createElement('div');
  ff.className = 'fixed-fields';

  let fieldsHtml = '';
  for(let i=0;i<RTO_CARE_FIELDS.length;i+=2){
    const f1 = RTO_CARE_FIELDS[i], f2 = RTO_CARE_FIELDS[i+1];
    fieldsHtml += `<div class="field-row">
      <div class="field"><label>${f1.label}</label><input type="${f1.type}" ${f1.type==='number'?'step="0.01"':''} id="rc_${index}_${f1.key}" value="${f1.type==='text'||f1.type==='date' ? escapeHtml(rec[f1.key]) : rec[f1.key]}"></div>
      ${f2 ? `<div class="field"><label>${f2.label}</label><input type="${f2.type}" ${f2.type==='number'?'step="0.01"':''} id="rc_${index}_${f2.key}" value="${f2.type==='text'||f2.type==='date' ? escapeHtml(rec[f2.key]) : rec[f2.key]}"></div>` : '<div class="field"></div>'}
    </div>`;
  }
  fieldsHtml += `
    <div class="field-row">
      <div class="field"><label>Outstanding (auto)</label><input type="text" disabled id="rc_${index}_outstanding"></div>
      <div class="field"><label>Breakeven — months (auto)</label><input type="text" disabled id="rc_${index}_breakeven"></div>
    </div>
  `;
  ff.innerHTML = fieldsHtml;
  card.appendChild(ff);

  RTO_CARE_FIELDS.forEach(f=>{
    ff.querySelector(`#rc_${index}_${f.key}`).oninput = e=>{
      rec[f.key] = e.target.value;
      updateRecordCalc();
      if(f.key==='customerName' || f.key==='branch'){
        summary.querySelector('.rc-title').textContent = `${rec.customerName||'New Customer'} ${rec.branch?('· '+rec.branch):''}`;
      }
    };
  });

  function updateRecordCalc(){
    const out = num(rec.totalContractValue) - num(rec.paymentReceived);
    const be = num(rec.monthlyInstallment) > 0 ? (num(rec.cost) / num(rec.monthlyInstallment)) : 0;
    ff.querySelector(`#rc_${index}_outstanding`).value = 'RM ' + fmt(out);
    ff.querySelector(`#rc_${index}_breakeven`).value = be ? be.toFixed(2) + ' months' : '-';
    summary.querySelector('.rc-outstanding').textContent = 'RM ' + fmt(out);
  }
  updateRecordCalc();

  // Payment / due date schedule
  const schedWrap = document.createElement('div');
  schedWrap.style.padding = '4px 14px 12px';
  const schedTitleRow = document.createElement('div');
  schedTitleRow.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px;';
  schedTitleRow.innerHTML = `<span style="font-weight:700;font-size:12.5px;color:var(--navy-2);">Monthly Payment Schedule</span>`;
  schedWrap.appendChild(schedTitleRow);

  const genBtn = document.createElement('button');
  genBtn.className = 'add-row-btn';
  genBtn.style.margin = '0 0 8px';
  genBtn.textContent = rec.schedule.length ? '↻ Regenerate from Tenure' : '+ Generate Schedule from Tenure';
  genBtn.onclick = ()=>{
    const months = parseInt(rec.tenure, 10) || 0;
    if(months <= 0){ showToast('Set Tenure (months) first'); return; }
    const existing = rec.schedule || [];
    const newSchedule = [];
    for(let n=1;n<=months;n++){
      const prev = existing[n-1];
      const dueDate = rec.autoDebitStartDate ? addMonthsISO(rec.autoDebitStartDate, n-1) : (prev ? prev.dueDate : '');
      newSchedule.push({ label: ordinal(n), dueDate, paidDate: prev ? prev.paidDate : '' });
    }
    rec.schedule = newSchedule;
    renderMain();
  };
  schedWrap.appendChild(genBtn);

  const schedHead = document.createElement('div');
  schedHead.style.cssText = 'display:flex;gap:6px;padding:2px 2px;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;';
  schedHead.innerHTML = `<span style="flex:0 0 44px;">#</span><span style="flex:1;">Due Date</span><span style="flex:1;">Paid Date</span><span style="flex:0 0 50px;">Status</span><span style="flex:0 0 20px;"></span>`;
  schedWrap.appendChild(schedHead);

  const schedList = document.createElement('div');
  rec.schedule.forEach((s, si)=>{
    const status = installmentStatus(s);
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:6px;align-items:center;padding:5px 2px;border-bottom:1px solid #F0EEE6;';
    row.innerHTML = `
      <input type="text" style="flex:0 0 44px;border:none;background:transparent;font-size:12px;padding:4px 2px;" value="${escapeHtml(s.label)}" placeholder="1st">
      <input type="date" style="flex:1;border:none;background:#FAF9F5;border-radius:6px;padding:5px 6px;font-size:11.5px;" value="${s.dueDate||''}">
      <input type="date" style="flex:1;border:none;background:#FAF9F5;border-radius:6px;padding:5px 6px;font-size:11.5px;" value="${s.paidDate||''}">
      <span style="flex:0 0 50px;font-size:10.5px;font-weight:700;color:${statusColor(status)};">${status}</span>
      <button class="del" style="flex:0 0 20px;">✕</button>
    `;
    const inputs = row.querySelectorAll('input');
    inputs[0].oninput = e=>{ s.label = e.target.value; };
    inputs[1].onchange = e=>{ s.dueDate = e.target.value; renderMain(); };
    inputs[2].onchange = e=>{ s.paidDate = e.target.value; renderMain(); };
    row.querySelector('.del').onclick = ()=>{ rec.schedule.splice(si,1); renderMain(); };
    schedList.appendChild(row);
  });
  schedWrap.appendChild(schedList);

  const addSchedBtn = document.createElement('button');
  addSchedBtn.className = 'add-row-btn';
  addSchedBtn.textContent = '+ Add single row';
  addSchedBtn.onclick = ()=>{
    rec.schedule.push({label: ordinal(rec.schedule.length+1), dueDate:'', paidDate:''});
    renderMain();
  };
  schedWrap.appendChild(addSchedBtn);
  card.appendChild(schedWrap);

  const delBtn = document.createElement('button');
  delBtn.textContent = 'Delete Customer';
  delBtn.style.cssText = 'margin:0 14px 14px;padding:8px 12px;border-radius:8px;border:1px solid var(--danger);background:#fff;color:var(--danger);font-size:12.5px;font-weight:600;cursor:pointer;';
  delBtn.onclick = ()=>{ records.splice(index,1); if(records.length===0) records.push(defaultRtoCareRecord()); renderMain(); };
  card.appendChild(delBtn);

  return card;
}

async function listFailedMonths(){
  try{
    const res = await window.storage.list('failed:', STORAGE_SHARED);
    if(!res || !res.keys) return [];
    return res.keys.map(k=>k.split(':')[1]).sort().reverse();
  }catch(e){ return []; }
}

async function renderFailedUI(main){
  const mp = document.createElement('div');

      <input type="text" placeholder="Customer name" value="${escapeHtml(r.name)}" style="flex:1.3">

  const total = currentFailed.rows.reduce((s,r)=>s+num(r.amount),0);
  const totalRow = document.createElement('div');
  totalRow.className = 'total-row';
  totalRow.innerHTML = `<span>TOTAL</span><span class="tval">RM ${fmt(total)}</span>`;

  main.appendChild(card);

function updateFailedTotal(card){
  const total = currentFailed.rows.reduce((s,r)=>s+num(r.amount),0);
  card.querySelector('.tval').textContent = 'RM ' + fmt(total);
}

// ---------- Copy as text ----------
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- Save as photo ----------
function photoSectionTable(title, rows, totalLabel, totalValue){
  let html = `<div style="margin-bottom:14px;border:1px solid #ddd;border-radius:4px;overflow:hidden;">`;
  html += `<div style="background:#C9D9F0;color:#1C2333;font-weight:700;font-size:15px;padding:8px 14px;">${title}</div>`;
  rows.forEach(r=>{
    if(!r.label && !r.amount) return;
    html += `<div style="display:flex;justify-content:space-between;padding:7px 14px;background:#FBF8EF;border-bottom:1px solid #EFEAD9;font-size:14px;">
      <span>${escapeHtml(r.label)||'&nbsp;'}</span><span style="font-weight:600;">RM ${fmt(num(r.amount))}</span></div>`;
  });
  html += `<div style="display:flex;justify-content:space-between;padding:8px 14px;background:#0A1628;color:#fff;font-weight:700;font-size:14px;">
    <span>${totalLabel}</span><span>RM ${fmt(totalValue)}</span></div>`;
  html += `</div>`;
  return html;
}

            t+=num(r.amount);
          });
          html += `<div style="display:flex;justify-content:space-between;padding:8px 14px;background:#0A1628;color:#fff;font-weight:700;font-size:14px;">
            <span>TOTAL</span><span>RM ${fmt(t)}</span></div></div>`;
          return html;
        }
        if(currentCompany==='miniImpianSales'){
          const d = currentData.sections[sec];
          const sandakanHtml = qtySectionHtml(`${SECTION_TITLES[sec]} — Sandakan Branch`, d.sandakan);
          const tawauHtml = qtySectionHtml(`${SECTION_TITLES[sec]} — Tawau Branch`, d.tawau);
          inner += `<div style="display:flex;gap:14px;align-items:flex-start;">
            <div style="flex:1;min-width:0;">${sandakanHtml}</div>
            <div style="flex:1;min-width:0;">${tawauHtml}</div>
          </div>`;
        } else {
          inner += qtySectionHtml(SECTION_TITLES[sec], currentData.sections[sec]);
        }
      } else {
        const rows = currentData.sections[sec];
        const total = rows.reduce((s,r)=>s+num(r.amount),0);
        inner += photoSectionTable(SECTION_TITLES[sec], rows, 'TOTAL', total);
      }
    });
  }
  return inner;
}

async function buildAllFailedPhotoHTML(){
  const months = await listFailedMonths();
  let inner = `<h2 style="margin:0 0 4px;font-size:19px;">FAILED PAYMENT (RTO)</h2>`;
  inner += `<div style="color:#666;font-size:13px;margin-bottom:14px;">All months on record</div>`;

  if(months.length===0){
    inner += `<div style="padding:10px;color:#888;font-size:13px;">No failed payment months saved yet.</div>`;
    return inner;
  }

  let grandTotal = 0;
  for(const m of months){
    let rows = [];
    if(m === currentFailed.month){
      rows = currentFailed.rows;
    } else {
      try{
        const res = await window.storage.get(storageKeyFailed(m), STORAGE_SHARED);
        rows = res && res.value ? JSON.parse(res.value).rows : [];
      }catch(e){ rows = []; }
    }
    rows = rows.filter(r=>r.name || r.amount);
    const monthTotal = rows.reduce((s,r)=>s+num(r.amount),0);
    grandTotal += monthTotal;

    inner += `<div style="margin-bottom:14px;border:1px solid #ddd;border-radius:4px;overflow:hidden;">`;
    inner += `<div style="background:#C9D9F0;color:#1C2333;font-weight:700;font-size:15px;padding:8px 14px;">Month: ${m}</div>`;
    inner += `<div style="display:flex;background:#f0eee6;font-weight:700;font-size:12px;padding:6px 14px;">
      <span style="flex:1.4;">NAME</span><span style="flex:1;">CONTACT</span><span style="flex:0.8;text-align:right;">AMT</span></div>`;
    if(rows.length===0){
      inner += `<div style="padding:8px 14px;color:#999;font-size:13px;background:#FBF8EF;">No failed payments recorded</div>`;
    }
    rows.forEach(r=>{
      inner += `<div style="display:flex;padding:6px 14px;background:#FBF8EF;border-bottom:1px solid #EFEAD9;font-size:13px;">
        <span style="flex:1.4;">${escapeHtml(r.name)}</span><span style="flex:1;">${escapeHtml(r.contact)}</span>
        <span style="flex:0.8;text-align:right;font-weight:600;">${fmt(num(r.amount))}</span></div>`;
    });
    inner += `<div style="display:flex;justify-content:space-between;padding:7px 14px;background:#0A1628;color:#fff;font-weight:700;font-size:13.5px;">
      <span>Month Total</span><span>RM ${fmt(monthTotal)}</span></div>`;
    inner += `</div>`;
  }

  inner += `<div style="display:flex;justify-content:space-between;padding:10px 14px;background:#1C2333;color:#FFD500;font-weight:700;font-size:15px;border-radius:4px;">
    <span>GRAND TOTAL</span><span>RM ${fmt(grandTotal)}</span></div>`;

  return inner;
}

async function saveAsPhoto(){
  if(typeof html2canvas === 'undefined'){ showToast('Image tool still loading, try again'); return; }
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;left:-9999px;top:0;width:560px;background:#F6F4EE;padding:20px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#20242E;';
  const isFailed = COMPANIES[currentCompany].isLog;
  container.innerHTML = isFailed ? await buildAllFailedPhotoHTML() : buildPhotoHTML();
  document.body.appendChild(container);
  try{
    const canvas = await html2canvas(container, {backgroundColor:'#F6F4EE', scale:2});
    const name = isFailed ? `failed-payments-all-months` : `${currentCompany}-${currentData.date}`;

    canvas.toBlob(function(blob){
      if(!blob){ showToast('Could not generate photo'); return; }
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${name}.png`;
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      setTimeout(()=>{
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }, 1000);
      showToast('Photo saved ✓ check your Downloads');
    }, 'image/png');
  }catch(e){
    showToast('Could not generate photo: '+e.message);
  }finally{
    document.body.removeChild(container);
  }
}

document.getElementById('photoBtn').onclick = saveAsPhoto;
document.getElementById('saveBtn').onclick = saveReport;

})();
